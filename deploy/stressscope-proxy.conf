# cPanel/WHM Apache reverse-proxy include for StressScope.
# This routes the subdomain's vhost to the uvicorn service on 127.0.0.1:8765,
# including the /ws/ WebSocket live feed.
#
# Install it as a cPanel "userdata" include so WHM does NOT overwrite it:
#   /etc/apache2/conf.d/userdata/std/2_4/<cpuser>/<subdomain>/stressscope.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/<cpuser>/<subdomain>/stressscope.conf
# then: /scripts/ensure_vhost_includes --user=<cpuser> && /scripts/rebuildhttpdconf && systemctl restart httpd
#
# Requires modules: proxy, proxy_http, proxy_wstunnel, rewrite (all ship with EA4).

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https" env=HTTPS

# Upgrade WebSocket connections (the /ws/{job_id} live feed) to the uvicorn ws:// endpoint.
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/?(.*) ws://127.0.0.1:8765/$1 [P,L]

# Everything else: plain HTTP reverse proxy.
ProxyPass        / http://127.0.0.1:8765/ timeout=600
ProxyPassReverse / http://127.0.0.1:8765/
